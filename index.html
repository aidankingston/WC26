<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>World Cup 26™ Family Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');
  :root { --primary: #111424; --bg: #F4F6F9; --Zelda: #8A2BE2; --Colman: #007BFF; --Connie: #28A745; --Jemma: #FFD700; --Aidan: #DC3545; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; }
  .app-bar { background: var(--primary); color: white; height: 60px; display: flex; align-items: center; justify-content: center; position: fixed; top: 0; width: 100%; z-index: 1000; }
  .app-content { margin-top: 70px; padding: 15px; }
  .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; border-left: 5px solid #ddd; }
  .nav-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: var(--primary); display: flex; justify-content: space-around; align-items: center; z-index: 2000; }
  .nav-btn { color: #888; text-align: center; cursor: pointer; font-size: 12px; }
  .nav-btn.active { color: white; }
  .screen { display: none; } .screen.active { display: block; }
  .score-input { width: 35px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
</style>
</head>
<body>
<div class="app-bar"><h1>WC 26 Tracker</h1></div>
<div class="app-content">
  <main id="screen-board" class="screen active">
    <h2>🏆 Leaderboard</h2><div id="leaderboard"></div>
    <h2>👥 Family Teams</h2><div id="team-tables"></div>
  </main>
  <main id="screen-fixtures" class="screen"><div id="fixtures-grid"></div></main>
</div>
<div class="nav-bar">
  <div class="nav-btn active" onclick="nav('board', this)">🏆<br>Board</div>
  <div class="nav-btn" onclick="nav('fixtures', this)">⚽<br>Matches</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbws7RthlNJK9pLYtKquf7XDzL_vzI25kPmg8BuqJmQENyRHLZUaY8FMKCNJoaJxsRB0/exec";
  const owners = {"Mexico":"Connie","South Africa":"Connie","South Korea":"Jemma","UEFA D":"Jemma","Canada":"Colman","UEFA A":"Zelda","Qatar":"Zelda","Switzerland":"Connie","Brazil":"Zelda","Morocco":"Aidan","Haiti":"Aidan","Scotland":"Zelda","United States":"Zelda","Paraguay":"Zelda","Australia":"Zelda","UEFA C":"Aidan","Germany":"Colman","Curacao":"Jemma","Ivory Coast":"Connie","Ecuador":"Jemma","Netherlands":"Connie","Japan":"Aidan","UEFA B":"Connie","Tunisia":"Jemma","Belgium":"Colman","Egypt":"Connie","Iran":"Zelda","New Zealand":"Aidan","Spain":"Jemma","Cape Verde":"Aidan","Saudi Arabia":"Jemma","Uruguay":"Aidan","France":"Colman","Senegal":"Colman","Norway":"Connie","FIFA 2":"Aidan","Argentina":"Zelda","Algeria":"Colman","Austria":"Connie","Jordan":"Jemma","Portugal":"Aidan","FIFA 1":"Colman","Uzbekistan":"Jemma","Colombia":"Colman","England":"Colman","Croatia":"Zelda","Ghana":"Colman","Panama":"Connie"};

  function nav(s, el) {
    document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
    document.getElementById(`screen-${s}`).classList.add('active');
    el.classList.add('active');
  }

  function jsonp(url) { return new Promise(r => { const cb = 'c'+Date.now(); window[cb] = (d) => { delete window[cb]; r(d); }; const s = document.createElement('script'); s.src = `${url}&callback=${cb}`; document.body.appendChild(s); }); }

  async function init() {
    const [fixtures, scores] = await Promise.all([jsonp(SCRIPT_URL + "?action=getFixtures"), jsonp(SCRIPT_URL + "?action=get")]);
    
    // Team Tables
    const tGrid = document.getElementById('team-tables');
    const myTeams = {};
    Object.entries(owners).forEach(([t, o]) => { if(!myTeams[o]) myTeams[o] = []; myTeams[o].push(t); });
    Object.entries(myTeams).forEach(([o, t]) => {
      tGrid.innerHTML += `<div class="card" style="border-left-color:var(--${o})"><b>${o}</b><br><small>${t.join(', ')}</small></div>`;
    });

    // Fixtures
    const fGrid = document.getElementById('fixtures-grid');
    fixtures.forEach(m => {
      fGrid.innerHTML += `<div class="card">
        <div style="font-size:9px; color:#888">${m.Stage} | ${m["Date & Time (US EDT/UTC-4)"]} | ${m.Location}</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${m["Team 1"]}</span>
          <input class="score-input" value="${scores[m["Match #"]]?.hS||''}" onchange="updateScore('${m["Match #"]}', true, this.value)">
          -
          <input class="score-input" value="${scores[m["Match #"]]?.aS||''}" onchange="updateScore('${m["Match #"]}', false, this.value)">
          <span>${m["Team 2"]}</span>
        </div>
      </div>`;
    });
  }

  function updateScore(id, isH, val) {
    fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams({action:'update', id:id, h:isH?val:'', a:!isH?val:''}) });
  }
  init();
</script>
</body>
</html>
