<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WC26 | Family Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header" onclick="show('home')">WORLD Cup 2026™</div>
    <div id="toast" class="toast">Syncing...</div>
    
    <div id="screen-home" class="screen active">
        <div class="tile" onclick="show('leaderboard')">🏆 Leaderboard</div>
        <div class="tile" onclick="show('bracket')">🎯 Knockouts</div>
        <div class="tile" onclick="show('fixtures')">⚽ Matches</div>
    </div>
    
    <div id="screen-leaderboard" class="screen"><button class="btn-back" onclick="show('home')">Home</button><div id="leaderboard-data"></div></div>
    <div id="screen-bracket" class="screen"><button class="btn-back" onclick="show('home')">Home</button><div id="bracket-data" class="bracket-container"></div></div>
    <div id="screen-fixtures" class="screen"><button class="btn-back" onclick="show('home')">Home</button><div id="fixtures-data"></div></div>
    
    <nav class="nav-bar">
        <div class="nav-btn" onclick="show('home')">🏠Home</div>
        <div class="nav-btn" onclick="show('leaderboard')">🏆Board</div>
        <div class="nav-btn" onclick="show('bracket')">🎯Knockout</div>
        <div class="nav-btn" onclick="show('fixtures')">⚽Matches</div>
    </nav>
    <script src="app.js"></script>
</body>
</html>
