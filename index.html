<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 26™ Family Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
  :root { --primary: #111424; --Zelda: #8A2BE2; --Colman: #007BFF; --Connie: #28A745; --Jemma: #FFD700; --Aidan: #DC3545; }
  body { font-family: 'Outfit', sans-serif; background: #F4F6F9; margin: 0; padding-bottom: 80px; }
  .app-bar { background: var(--primary); color: white; height: 60px; display: flex; align-items: center; justify-content: center; position: fixed; top: 0; width: 100%; z-index: 1000; }
  .app-content { margin-top: 70px; padding: 15px; }
  .nav-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--primary); display: flex; justify-content: space-around; align-items: center; z-index: 2000; }
  .nav-btn { color: #888; font-size: 12px; text-align: center; cursor: pointer; }
  .nav-btn.active { color: white; }
  .screen { display: none; } .screen.active { display: block; }
  .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #ddd; }
  .owner-badge { font-size: 9px; padding: 2px 6px; border-radius: 10px; color: white; font-weight: bold; text-transform: uppercase; }
  .score-input { width: 35px; text-align: center; border: 1px solid #ddd; border-radius: 4px; }
</style>
</head>
<body>
<div class="app-bar"><h1>WC 26 Tracker</h1></div>
<div class="app-content">
  <main id="screen-family" class="screen active">
    <h2>🏆 Leaderboard</h2><div id="family-grid"></div>
    <h2>👥 My Teams</h2><div id="teams-grid"></div>
  </main>
  <main id="screen-fixtures" class="screen"><div id="fixtures-grid"></div></main>
</div>
<div class="nav-bar">
  <div class="nav-btn active" onclick="navigate('family', this)">🏆<br>Board</div>
  <div class="nav-btn" onclick="navigate('fixtures', this)">⚽<br>Matches</div>
</div>
<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbws7RthlNJK9pLYtKquf7XDzL_vzI25kPmg8BuqJmQENyRHLZUaY8FMKCNJoaJxsRB0/exec";
  const owners = {"Mexico":"Connie","South Africa":"Connie","South Korea":"Jemma","UEFA D":"Jemma","Canada":"Colman","UEFA A":"Zelda","Qatar":"Zelda","Switzerland":"Connie","Brazil":"Zelda","Morocco":"Aidan","Haiti":"Aidan","Scotland":"Zelda","United States":"Zelda","Paraguay":"Zelda","Australia":"Zelda","UEFA C":"Aidan","Germany":"Colman","Curacao":"Jemma","Ivory Coast":"Connie","Ecuador":"Jemma","Netherlands":"Connie","Japan":"Aidan","UEFA B":"Connie","Tunisia":"Jemma","Belgium":"Colman","Egypt":"Connie","Iran":"Zelda","New Zealand":"Aidan","Spain":"Jemma","Cape Verde":"Aidan","Saudi Arabia":"Jemma","Uruguay":"Aidan","France":"Colman","Senegal":"Colman","Norway":"Connie","FIFA 2":"Aidan","Argentina":"Zelda","Algeria":"Colman","Austria":"Connie","Jordan":"Jemma","Portugal":"Aidan","FIFA 1":"Colman","Uzbekistan":"Jemma","Colombia":"Colman","England":"Colman","Croatia":"Zelda","Ghana":"Colman","Panama":"Connie"};

  function navigate(s, el) {
    document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
    document.getElementById(`screen-${s}`).classList.add('active');
    el.classList.add('active');
  }

  function jsonp(url) {
    return new Promise((resolve) => {
      const cb = 'cb_' + Math.round(Math.random() * 10000);
      window[cb] = (data) => { delete window[cb]; resolve(data); };
      const s = document.createElement('script'); s.src = `${url}&callback=${cb}`;
      document.body.appendChild(s);
    });
  }

  async function init() {
    const fixtures = await jsonp(SCRIPT_URL + "?action=getFixtures");
    const scores = await jsonp(SCRIPT_URL + "?action=get");
    
    // Fixtures
    const fGrid = document.getElementById('fixtures-grid');
    fixtures.forEach(m => {
      let id = m["Match #"];
      fGrid.innerHTML += `<div class="card">
        <div style="font-size:10px; color:#888">${m.Stage} | ${m["Date & Time (US EDT/UTC-4)"]} | ${m.Location}</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px">
          <span class="owner-badge" style="background:var(--${owners[m["Team 1"]]})">${owners[m["Team 1"]]}</span>
          <span>${m["Team 1"]}</span>
          <input class="score-input" value="${scores[id]?.hS||''}" onchange="updateScore('${id}', true, this.value)">
          -
          <input class="score-input" value="${scores[id]?.aS||''}" onchange="updateScore('${id}', false, this.value)">
          <span>${m["Team 2"]}</span>
          <span class="owner-badge" style="background:var(--${owners[m["Team 2"]]})">${owners[m["Team 2"]]}</span>
        </div>
      </div>`;
    });

    // My Teams
    const tGrid = document.getElementById('teams-grid');
    let myTeams = {};
    Object.entries(owners).forEach(([team, owner]) => {
      if(!myTeams[owner]) myTeams[owner] = [];
      myTeams[owner].push(team);
    });
    Object.entries(myTeams).forEach(([owner, teams]) => {
      tGrid.innerHTML += `<div class="card"><b style="color:var(--${owner})">${owner}</b><br><small>${teams.join(', ')}</small></div>`;
    });
  }

  function updateScore(id, isH, val) {
    fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/x-www-form-urlencoded'}, body: `action=update&id=${id}&h=${isH?val:''}&a=${!isH?val:''}` });
  }
  init();
</script>
</body>
</html>
