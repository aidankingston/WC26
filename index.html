<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 26™ Family Edition</title>
<style>
  :root { --primary: #111424; --bg-color: #f4f6f9; }
  body { font-family: sans-serif; background: var(--bg-color); margin: 0; padding-bottom: 80px; }
  .app-bar { background: var(--primary); color: white; height: 60px; display: flex; align-items: center; justify-content: center; position: fixed; top: 0; width: 100%; }
  .content { margin-top: 70px; padding: 15px; }
  .card { background: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #ddd; }
  .match-row { display: flex; justify-content: space-between; align-items: center; }
  .score-input { width: 40px; text-align: center; }
</style>
</head>
<body>
<div class="app-bar"><h1>WC 2026 Tracker</h1></div>
<div class="content" id="fixtures-grid">Loading...</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbws7RthlNJK9pLYtKquf7XDzL_vzI25kPmg8BuqJmQENyRHLZUaY8FMKCNJoaJxsRB0/exec";

  // Helper for JSONP
  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const callback = 'cb_' + Math.round(Math.random() * 10000);
      window[callback] = (data) => {
        delete window[callback];
        document.body.removeChild(script);
        resolve(data);
      };
      const script = document.createElement('script');
      script.src = `${url}&callback=${callback}`;
      document.body.appendChild(script);
    });
  }

  async function init() {
    try {
      const fixtures = await jsonp(SCRIPT_URL + "?action=getFixtures");
      const scores = await jsonp(SCRIPT_URL + "?action=get");
      
      const grid = document.getElementById('fixtures-grid');
      grid.innerHTML = '';
      fixtures.forEach(m => {
        let id = m["Match #"];
        grid.innerHTML += `
          <div class="card">
            <div class="match-row">
              <span>${m["Team 1"]}</span>
              <div>
                <input class="score-input" value="${scores[id]?.hS||''}" onchange="updateScore('${id}', true, this.value)"> - 
                <input class="score-input" value="${scores[id]?.aS||''}" onchange="updateScore('${id}', false, this.value)">
              </div>
              <span>${m["Team 2"]}</span>
            </div>
          </div>`;
      });
    } catch (err) {
      document.getElementById('fixtures-grid').innerHTML = 'Error loading data.';
    }
  }

  function updateScore(id, isH, val) {
    // Keep using POST for updates as it's cleaner for writing data
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `action=update&id=${id}&h=${isH ? val : ''}&a=${!isH ? val : ''}`
    });
  }
  init();
</script>
</body>
</html>
