<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header" onclick="show('home')">WORLD Cup 2026™</div>
    <div id="screen-home" class="screen active">
        <div class="tile" onclick="show('bracket')">🎯 Knockouts</div>
    </div>
    <div id="screen-bracket" class="screen"><div id="bracket-data" class="bracket-container"></div></div>
    <script src="app.js"></script>

    <div id="score-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>Log Score</h3>
    <input type="number" id="inp-h" class="modal-input"> VS <input type="number" id="inp-a" class="modal-input">
    <br><br><button onclick="saveScore()">Save</button>
  </div>
</div>
    
</body>
</html>
