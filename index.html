<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WC26 | Family Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* V27/V28 Aesthetic Enhancements */
        .match-row-horizontal { display: flex; flex-direction: column; background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); border-left: 4px solid var(--primary); }
        .match-meta-header { display: flex; justify-content: space-between; font-size: 11px; color: #777; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .match-teams-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .team-block { display: flex; flex-direction: column; flex: 1; }
        .team-block.home { text-align: right; padding-right: 15px; }
        .team-block.away { text-align: left; padding-left: 15px; }
        .team-name { font-size: 14px; font-weight: bold; }
        .team-owner { font-size: 10px; color: #888; }
        .team-flag { font-size: 20px; }
        .score-center { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100px; }
        .score-inputs { display: flex; align-items: center; gap: 5px; }
        .score-box-input { width: 35px; height: 35px; text-align: center; font-size: 16px; font-weight: bold; border: 2px solid #ddd; border-radius: 6px; }
        .pen-inputs { display: flex; gap: 20px; margin-top: 4px; }
        .pen-input { width: 25px; height: 20px; text-align: center; font-size: 10px; border: 1px dashed #aaa; border-radius: 3px; background: #f9f9f9; }
        .btn-save { margin-top: 8px; width: 100%; background: var(--primary); color: white; border: none; padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .btn-save.loading { background: #ccc; }
        .next-unplayed-match { border: 2px solid #e74c3c; box-shadow: 0 0 12px rgba(231, 76, 60, 0.3); }
        .next-unplayed-badge { color: #e74c3c; font-weight: bold; }
        
        .family-squad-section { margin-bottom: 30px; background: #fafafa; padding: 15px; border-radius: 10px; border: 1px solid #e0e0e0; }
        .family-squad-section h3 { margin-top: 0; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 8px; font-size: 18px; }
    </style>
</head>
<body>
    <div class="header" onclick="show('home')">WORLD Cup 2026™</div>

    <div id="debug-console" style="display:block; background:#111; color:#0f0; padding:15px; margin:10px auto; max-width:900px; font-family:monospace; font-size:12px; border-radius:8px; overflow-x:auto; max-height: 250px; overflow-y: auto; text-align:left; line-height:1.5; border: 2px solid #0f0;">
        <strong style="color:#fff;">[SYSTEM DIAGNOSTICS - V28]</strong><br>
    </div>
    
    <div id="screen-home" class="screen active">
        <div class="tile-grid">
            <div class="tile" onclick="show('leaderboard')">🏆 Leaderboard</div>
            <div class="tile" onclick="show('groups')">📊 Group Standings</div>
            <div class="tile" onclick="show('bracket')">🎯 Knockouts</div>
            <div class="tile" onclick="show('fixtures')">⚽ Matches & Results</div>
            <div class="tile" onclick="show('teams')">👥 Family Squads</div>
            <div class="tile" onclick="show('transfers')">🔄 Transfers</div>
        </div>
        <div id="sync-status" style="text-align:center; margin-top:20px; font-size:13px; font-weight:bold; color:var(--primary);">Initializing System...</div>
    </div>
    
    <div id="screen-leaderboard" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="leaderboard-data"></div></div>
    <div id="screen-groups" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="groups-data"></div></div>
    <div id="screen-bracket" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="bracket-data" class="bracket-container"></div></div>
    <div id="screen-fixtures" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="fixtures-data"></div></div>
    <div id="screen-teams" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="team-tables"></div></div>
    <div id="screen-transfers" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="history-data"></div></div>

    <nav class="nav-bar">
        <div class="nav-btn" onclick="show('home')">🏠<br>Home</div>
        <div class="nav-btn" onclick="show('groups')">📊<br>Groups</div>
        <div class="nav-btn" onclick="show('bracket')">🎯<br>Bracket</div>
        <div class="nav-btn" onclick="show('fixtures')">⚽<br>Matches</div>
        <div class="nav-btn" onclick="show('teams')">👥<br>Squads</div>
    </nav>

    <script src="app.js?v=28"></script>
</body>
</html>
