<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WC26 | Family Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header" onclick="show('home')">WORLD Cup 2026™</div>
    
    <div id="screen-home" class="screen active">
        <div class="tile-grid">
            <div class="tile" onclick="show('leaderboard')">🏆 Leaderboard</div>
            <div class="tile" onclick="show('groups')">📊 Group Standings</div>
            <div class="tile" onclick="show('bracket')">🎯 Knockouts</div>
            <div class="tile" onclick="show('teams')">👥 Family Squads</div>
            <div class="tile" onclick="show('transfers')">🔄 Transfers</div>
        </div>
        <div id="sync-status" style="text-align:center; margin-top:20px; font-size:12px; color:#666;">Syncing with Google Sheets...</div>
    </div>
    
    <div id="screen-leaderboard" class="screen">
        <button class="btn-back" onclick="show('home')">← Back to Menu</button>
        <div id="leaderboard-data"></div>
    </div>
    
    <div id="screen-groups" class="screen">
        <button class="btn-back" onclick="show('home')">← Back to Menu</button>
        <div id="groups-data"></div>
    </div>
    
    <div id="screen-bracket" class="screen">
        <button class="btn-back" onclick="show('home')">← Back to Menu</button>
        <div id="bracket-data" class="bracket-container"></div>
    </div>
    
    <div id="screen-teams" class="screen">
        <button class="btn-back" onclick="show('home')">← Back to Menu</button>
        <div id="team-tables"></div>
    </div>
    
    <div id="screen-transfers" class="screen">
        <button class="btn-back" onclick="show('home')">← Back to Menu</button>
        <div id="history-data"></div>
    </div>

    <nav class="nav-bar">
        <div class="nav-btn" onclick="show('home')">🏠<br>Home</div>
        <div class="nav-btn" onclick="show('leaderboard')">🏆<br>Board</div>
        <div class="nav-btn" onclick="show('groups')">📊<br>Groups</div>
        <div class="nav-btn" onclick="show('bracket')">🎯<br>Bracket</div>
        <div class="nav-btn" onclick="show('teams')">👥<br>Squads</div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
