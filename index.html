<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 26™ Family Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
  :root { --primary: #111424; --bg-color: #F4F6F9; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg-color); margin: 0; padding-bottom: 80px; }
  .app-bar { background: var(--primary); color: white; height: 60px; display: flex; align-items: center; justify-content: center; position: fixed; top: 0; width: 100%; z-index: 1000; }
  .app-content { margin-top: 70px; padding: 0 15px; }
  .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #ddd; }
  .match-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .score-input { width: 45px; height: 40px; text-align: center; border: 1px solid #ddd; border-radius: 6px; font-weight: 800; }
</style>
</head>
<body>
<div class="app-bar"><h1>WC 2026 Tracker</h1></div>
<div class="app-content" id="fixtures-grid">Loading...</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbws7RthlNJK9pLYtKquf7XDzL_vzI25kPmg8BuqJmQENyRHLZUaY8FMKCNJoaJxsRB0/exec";

  async function init() {
    try {
      const [fRes, sRes] = await Promise.all([
        fetch(SCRIPT_URL + "?action=getFixtures", {mode: 'cors'}),
        fetch(SCRIPT_URL + "?action=get", {mode: 'cors'})
      ]);
      const fixtures = await fRes.json();
      const scores = await sRes.json();
      const grid = document.getElementById('fixtures-grid');
      grid.innerHTML = '';
      fixtures.forEach(m => {
        let id = m["Match #"];
        grid.innerHTML += `
          <div class="card">
            <div style="font-size:10px">${m.Stage}</div>
            <div class="match-row">
              <span>${m["Team 1"]}</span>
              <div>
                <input class="score-input" value="${scores[id]?.hS||''}" onchange="updateScore('${id}', true, this.value)"> - 
                <input class="score-input" value="${scores[id]?.aS||''}" onchange="updateScore('${id}', false, this.value)">
              </div>
              <span>${m["Team 2"]}</span>
            </div>
          </div>`;
      });
    } catch (err) {
      document.getElementById('fixtures-grid').innerHTML = 'Error: ' + err.message;
    }
  }

  function updateScore(id, isH, val) {
    let formData = new FormData();
    formData.append("action", "update");
    formData.append("id", id);
    formData.append("h", isH ? val : "");
    formData.append("a", !isH ? val : "");
    fetch(SCRIPT_URL, { method: 'POST', body: formData, mode: 'no-cors' });
  }
  init();
</script>
</body>
</html>
