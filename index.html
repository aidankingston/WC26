<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WC26 | Family Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* V32 UI Enhancements */
        body { background-color: #f4f7f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .header { background: linear-gradient(135deg, #003366, #00509e); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .nav-bar { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; justify-content: flex-start; padding: 10px 5px; gap: 5px; background: #003366; scrollbar-width: none; border-top: 1px solid #002244; }
        .nav-bar::-webkit-scrollbar { display: none; }
        .nav-btn { flex: 0 0 75px; scroll-snap-align: start; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px 2px; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
        
        .match-row-horizontal { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); }
        .match-meta-header { display: flex; justify-content: space-between; font-size: 11px; color: #555; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .match-teams-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .team-block { display: flex; flex-direction: column; flex: 1; gap: 3px; }
        .team-block.home { text-align: right; padding-right: 15px; }
        .team-block.away { text-align: left; padding-left: 15px; }
        .team-name { font-size: 15px; font-weight: 800; color: #222; }
        .team-owner { font-size: 11px; color: #888; font-weight: 500; }
        .team-flag { font-size: 24px; margin-bottom: 2px; }
        
        .score-center { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 110px; background: #f9fbfd; padding: 10px; border-radius: 10px; border: 1px solid #eef2f5; }
        .score-inputs { display: flex; align-items: center; gap: 8px; }
        .score-box-input { width: 38px; height: 38px; text-align: center; font-size: 18px; font-weight: 900; border: 2px solid #cbd5e1; border-radius: 8px; color: #003366; }
        .score-box-input:focus { border-color: var(--primary); outline: none; }
        .pen-inputs { display: flex; gap: 25px; margin-top: 6px; }
        .pen-input { width: 28px; height: 22px; text-align: center; font-size: 11px; border: 1px dashed #aaa; border-radius: 4px; font-weight: bold; }
        
        .btn-save { margin-top: 12px; width: 100%; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-save.loading { background: #95a5a6; }
        .next-unplayed-match { border: 2px solid #e74c3c; box-shadow: 0 0 15px rgba(231, 76, 60, 0.15); }
        .next-unplayed-badge { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 4px; font-size: 9px; margin-right: 5px; }
        
        .family-squad-section { margin-bottom: 25px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .family-squad-section h3 { margin-top: 0; color: #fff; background: var(--primary); display: inline-block; padding: 6px 15px; border-radius: 6px; font-size: 16px; margin-bottom: 15px; }
        .table-container { border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px #eee; }
        table th { background-color: #f1f5f9; color: #475569; font-size: 12px; text-transform: uppercase; padding: 12px 8px; }
        table td { padding: 12px 8px; border-bottom: 1px solid #f1f5f9; }
        
        .transfer-select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header" onclick="show('home')">WORLD Cup 2026™</div>

    <div id="debug-console" style="display:block; background:#111; color:#0f0; padding:15px; margin:10px auto; max-width:900px; font-family:monospace; font-size:12px; border-radius:8px; overflow-x:auto; max-height: 250px; overflow-y: auto; text-align:left; line-height:1.5; border: 2px solid #0f0;">
        <strong style="color:#fff;">[SYSTEM DIAGNOSTICS - V32]</strong><br>
    </div>
    
    <div id="screen-home" class="screen active">
        <div class="tile-grid">
            <div class="tile" onclick="show('leaderboard')">🏆 Leaderboard</div>
            <div class="tile" onclick="show('groups')">📊 Group Standings</div>
            <div class="tile" onclick="show('bracket')">🎯 Knockouts</div>
            <div class="tile" onclick="show('fixtures')">⚽ Matches & Results</div>
            <div class="tile" onclick="show('teams')">👥 Family Squads</div>
            <div class="tile" onclick="show('transfers')">🔄 Transfers</div>
        </div>
        <div id="sync-status" style="text-align:center; margin-top:20px; font-size:13px; font-weight:bold; color:var(--primary);">Initializing System...</div>
    </div>
    
    <div id="screen-leaderboard" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="leaderboard-data"></div></div>
    <div id="screen-groups" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="groups-data"></div></div>
    <div id="screen-bracket" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="bracket-data" class="bracket-container"></div></div>
    <div id="screen-fixtures" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="fixtures-data"></div></div>
    <div id="screen-teams" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="team-tables"></div></div>
    <div id="screen-transfers" class="screen"><button class="btn-back" onclick="show('home')">← Back</button><div id="history-data"></div></div>

    <nav class="nav-bar">
        <div class="nav-btn" onclick="show('home')">🏠<br>Home</div>
        <div class="nav-btn" onclick="show('leaderboard')">🏆<br>Board</div>
        <div class="nav-btn" onclick="show('groups')">📊<br>Groups</div>
        <div class="nav-btn" onclick="show('bracket')">🎯<br>Knockouts</div>
        <div class="nav-btn" onclick="show('fixtures')">⚽<br>Matches</div>
        <div class="nav-btn" onclick="show('teams')">👥<br>Squads</div>
        <div class="nav-btn" onclick="show('transfers')">🔄<br>Transfers</div>
    </nav>

    <script src="app.js?v=32"></script>
</body>
</html>
