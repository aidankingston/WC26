<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WC26 | Family Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');
  :root { --primary: #002366; --bg: #f8f9fa; --card: #ffffff; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; }
  
  .header { background: var(--primary); color: white; padding: 20px; text-align: center; font-weight: 700; }
  .screen { display: none; padding: 15px; } .screen.active { display: block; }
  
  /* Navigation */
  .nav-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
  .nav-btn { font-size: 10px; text-align: center; color: #666; }
  .nav-btn.active { color: var(--primary); font-weight: 700; }

  /* Professional Cards */
  .match-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr 60px 1fr; align-items: center; border-left: 4px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .team-img { width: 45px; height: 45px; object-fit: contain; }
  .flag { width: 24px; height: 16px; border-radius: 2px; }
  
  .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { background: var(--primary); color: white; padding: 20px; border-radius: 16px; text-align: center; font-weight: 500; }
</style>
</head>
<body>

<div class="header">WC 2026 FAMILY TRACKER</div>

<div id="screen-home" class="screen active">
  <div class="tile-grid">
    <div class="tile" onclick="show('leaderboard')">🏆 Leaderboard</div>
    <div class="tile" onclick="show('teams')">👥 My Teams</div>
    <div class="tile" onclick="show('fixtures')">⚽ Matches</div>
  </div>
</div>

<div id="screen-leaderboard" class="screen"><h2>Standings</h2><div id="leaderboard-data"></div></div>
<div id="screen-teams" class="screen"><h2>My Squads</h2><div id="team-tables"></div></div>
<div id="screen-fixtures" class="screen"><h2>Matches</h2><div id="fixtures-data"></div></div>

<div class="nav-bar">
  <div class="nav-btn" onclick="show('home')">🏠<br>Home</div>
  <div class="nav-btn" onclick="show('leaderboard')">🏆<br>Board</div>
  <div class="nav-btn" onclick="show('teams')">👥<br>Teams</div>
  <div class="nav-btn" onclick="show('fixtures')">⚽<br>Matches</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbws7RthlNJK9pLYtKquf7XDzL_vzI25kPmg8BuqJmQENyRHLZUaY8FMKCNJoaJxsRB0/exec";
  const countryCodes = {"Mexico":"mx","South Africa":"za","South Korea":"kr","Italy":"it","Canada":"ca","Germany":"de","Brazil":"br","Scotland":"gb-sct","United States":"us","England":"gb-eng"}; // Add all your codes here

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-'+id).classList.add('active');
  }

  // Smart visual: Tries jersey URL, falls back to flag
  function getTeamVisual(teamName, jerseyUrl) {
    if (jerseyUrl && jerseyUrl.startsWith('http')) {
      return `<img src="${jerseyUrl}" class="team-img" onerror="this.onerror=null; this.src='https://flagcdn.com/w40/${countryCodes[teamName] || 'xx'}.png'">`;
    }
    return `<img src="https://flagcdn.com/w40/${countryCodes[teamName] || 'xx'}.png" class="flag">`;
  }

  async function init() {
    const jsonp = (url) => new Promise(r => { const cb='c'+Date.now(); window[cb]=d=>{delete window[cb];r(d);}; const s=document.createElement('script'); s.src=`${url}&callback=${cb}`; document.body.appendChild(s); });
    const [fixtures] = await Promise.all([jsonp(SCRIPT_URL + "?action=getFixtures")]);
    
    const fGrid = document.getElementById('fixtures-data');
    fixtures.forEach(m => {
      // Assuming your Google Sheet has a column 'JerseyURL'
      fGrid.innerHTML += `<div class="match-card">
        <div style="text-align:center">${getTeamVisual(m["Team 1"], m["JerseyURL"])}<br><b>${m["Team 1"]}</b></div>
        <div style="text-align:center; font-size:10px">VS</div>
        <div style="text-align:center">${getTeamVisual(m["Team 2"], m["JerseyURL2"])}<br><b>${m["Team 2"]}</b></div>
      </div>`;
    });
  }
  init();
</script>
</body>
</html>
