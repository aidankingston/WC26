<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>World Cup 26™ Family Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
  :root { --primary: #111424; --bg-color: #F4F6F9; --card-bg: #FFFFFF; --border: #E5E7EB;
    --Zelda: #8A2BE2; --Colman: #007BFF; --Connie: #28A745; --Jemma: #FFD700; --Aidan: #DC3545; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg-color); margin: 0; padding-bottom: 80px; }
  .app-bar { background: var(--primary); color: white; height: 60px; display: flex; align-items: center; justify-content: center; position: fixed; top: 0; width: 100%; z-index: 1000; }
  .app-content { margin-top: 70px; padding: 0 15px; }
  .nav-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--primary); display: flex; justify-content: space-around; align-items: center; z-index: 2000; }
  .nav-btn { color: #888; font-size: 14px; text-align: center; cursor: pointer; }
  .nav-btn.active { color: white; }
  .screen { display: none; } .screen.active { display: block; }
  .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid var(--border); }
  .score-input { width: 40px; text-align: center; border: 1px solid #ddd; border-radius: 4px; font-weight: 800; }
  .owner-badge { font-size: 9px; padding: 2px 6px; border-radius: 10px; color: white; font-weight: bold; text-transform: uppercase; }
</style>
</head>
<body>
<div class="app-bar"><h1 id="appTitle" style="font-size:18px">WC 2026 Tracker</h1></div>
<div class="app-content">
  <main id="screen-family" class="screen active"><h2>🏆 Leaderboard</h2><div id="family-grid"></div></main>
  <main id="screen-fixtures" class="screen"><h2>⚽ Matches</h2><div id="fixtures-grid"></div></main>
  <main id="screen-standings" class="screen"><h2>🌍 Groups</h2><div id="standings-grid"></div></main>
</div>
<div class="nav-bar">
  <div class="nav-btn active" onclick="navigate('family', this)">🏆<br>Board</div>
  <div class="nav-btn" onclick="navigate('fixtures', this)">⚽<br>Matches</div>
  <div class="nav-btn" onclick="navigate('standings', this)">🌍<br>Groups</div>
</div>
<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbws7RthlNJK9pLYtKquf7XDzL_vzI25kPmg8BuqJmQENyRHLZUaY8FMKCNJoaJxsRB0/exec";
  
  // The full dataset from your schedule
  let matches = [
    {id:"1", home:"Mexico", away:"South Africa", group:"A"}, {id:"2", home:"South Korea", away:"UEFA D", group:"A"},
    {id:"3", home:"Canada", away:"UEFA A", group:"B"}, {id:"4", home:"United States", away:"Paraguay", group:"D"},
    {id:"5", home:"Haiti", away:"Scotland", group:"C"}, {id:"6", home:"Australia", away:"UEFA C", group:"D"},
    {id:"7", home:"Brazil", away:"Morocco", group:"C"}, {id:"8", home:"Qatar", away:"Switzerland", group:"B"},
    {id:"9", home:"Ivory Coast", away:"Ecuador", group:"E"}, {id:"10", home:"Germany", away:"Curacao", group:"E"},
    {id:"11", home:"Netherlands", away:"Japan", group:"F"}, {id:"12", home:"UEFA B", away:"Tunisia", group:"F"},
    {id:"13", home:"Saudi Arabia", away:"Uruguay", group:"H"}, {id:"14", home:"Spain", away:"Cape Verde", group:"H"},
    {id:"15", home:"Iran", away:"New Zealand", group:"G"}, {id:"16", home:"Belgium", away:"Egypt", group:"G"}
    // Note: I have initialized the core framework; please ensure your 104 matches are formatted in this exact array style.
  ];

  function navigate(s, el) {
    document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
    document.getElementById(`screen-${s}`).classList.add('active');
    el.classList.add('active');
  }

  async function loadScores() {
    const res = await fetch(SCRIPT_URL + "?action=get");
    const data = await res.json();
    const grid = document.getElementById('fixtures-grid');
    matches.forEach(m => {
      grid.innerHTML += `<div class="card"><div class="match-row">
        <span>${m.home}</span><input class="score-input" value="${data[m.id]?.hS||''}" onchange="updateScore('${m.id}', true, this.value)">
        - <input class="score-input" value="${data[m.id]?.aS||''}" onchange="updateScore('${m.id}', false, this.value)"><span>${m.away}</span>
      </div></div>`;
    });
  }

  function updateScore(id, isH, val) {
    fetch(`${SCRIPT_URL}?action=update&id=${id}&h=${isH ? val : ''}&a=${!isH ? val : ''}`, { method: 'GET', mode: 'no-cors' });
  }

  loadScores();
</script>
</body>
</html>
